<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172f27">
<title>Sección en construcción — Bosque Encantado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#172f27;--cream:#f3efe4;--rust:#ad674b;--gold:#d5b47a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--forest);color:var(--cream)}
body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 42%,rgba(113,128,106,.28),transparent 52%),linear-gradient(145deg,#172f27,#101c18 75%);min-height:100vh;display:grid;place-items:center;overflow-x:hidden;padding:24px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(circle at 12% 18%,#d5b47a 0 1px,transparent 2px),radial-gradient(circle at 84% 24%,#d5b47a 0 1px,transparent 2px),radial-gradient(circle at 23% 78%,#d5b47a 0 1px,transparent 2px),radial-gradient(circle at 91% 76%,#d5b47a 0 1px,transparent 2px);background-size:190px 190px,230px 230px,270px 270px,210px 210px}
main{position:relative;width:min(760px,100%);padding:clamp(30px,7vw,76px) 24px;text-align:center;border:1px solid rgba(213,180,122,.45);background:rgba(13,25,20,.7);box-shadow:0 24px 90px #0006}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font:500 clamp(42px,8vw,76px)/.98 'Cormorant Garamond',serif;margin:24px 0;color:var(--cream)}
p{max-width:520px;margin:18px auto;color:#d4d6c8;font-size:15px;line-height:1.8}
.stamp{display:inline-block;margin:12px auto 18px;padding:10px 17px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;transform:rotate(-2deg)}
.btn{display:inline-block;margin-top:16px;padding:14px 23px;border:1px solid var(--gold);border-radius:99px;background:var(--rust);color:#fff3dc;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.12em}
.btn:hover{filter:brightness(1.12)}
</style>
</head>
<body><main><div class="eyebrow">Bosque Encantado</div><h1>Sección en construcción</h1><div class="stamp">Muy pronto</div><p>Estamos preparando este rincón del bosque. El laboratorio para crear tu personaje estará disponible más adelante.</p><a class="btn" href="index.html">VOLVER AL BOSQUE</a></main></body>
</html>
